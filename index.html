<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Ask search engines and other crawlers not to index, follow, cache or preview this page. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Binder Finder</title>
<style>
  :root {
    --bg: #f4f4f6;
    --fg: #1d1d22;
    --muted: #6b6b75;
    --slot: #ffffff;
    --border: #d4d4dc;
    --hit: #2f6fed;
    --hit-fg: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171b;
      --fg: #ececf1;
      --muted: #9a9aa5;
      --slot: #24242a;
      --border: #3a3a44;
      --hit: #4c86ff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 860px; }
  .controls {
    max-width: 560px;
    margin: 8px auto 0;
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .tagline { color: var(--muted); margin: 0 0 20px; }
  .search { text-align: left; }
  input {
    width: 100%;
    font-family: inherit;
    font-size: 1.4rem;
    line-height: normal;
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--slot);
    color: var(--fg);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  input:focus {
    outline: none;
    border-color: var(--hit);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--hit) 20%, transparent);
  }
  /* Each line has a fixed height so the summary takes the same space
     before a search, and with or without a Pokémon name. */
  .info { margin: 24px 0 16px; font-size: 1.1rem; text-align: center; }
  .info.invisible { visibility: hidden; }
  .info > div { min-height: 1.5em; line-height: 1.5; }
  .info .where { min-height: 2.4rem; line-height: 2.4rem; }
  .info strong { font-size: 1.6rem; }
  .sub { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }
  .spread {
    display: flex;
    gap: 20px;
    justify-content: center;
  }
  .page {
    flex: 1 1 0;
    max-width: 400px;
    padding: 10px;
    border: 2px solid var(--border);
    border-radius: 10px;
  }
  .page.current { border-color: var(--hit); }
  .page.empty { visibility: hidden; }
  .page-label {
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .page.current .page-label { color: var(--hit); font-weight: 700; }
  @media (max-width: 520px) {
    .spread { gap: 8px; }
    .page { padding: 6px; }
    .grid { gap: 4px !important; }
    .slot { font-size: 0.8rem !important; }
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .slot {
    aspect-ratio: 63 / 88;
    background: var(--slot);
    border: 2px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.45rem;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .slot.hit {
    background: var(--hit);
    border-color: var(--hit);
    color: var(--hit-fg);
    font-weight: 700;
  }
  .slot { position: relative; min-width: 0; }
  .slot-name {
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: 5px;
    font-size: 0.68rem;
    font-weight: 400;
    text-align: center;
    color: var(--muted);
    opacity: 0.8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot.hit .slot-name { color: var(--hit-fg); opacity: 0.9; }
  @media (max-width: 520px) {
    .slot-name { font-size: 0.55rem; left: 2px; right: 2px; bottom: 3px; }
  }
  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
  }
  .pager button {
    font: inherit;
    font-size: 1rem;
    padding: 8px 16px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: var(--slot);
    color: var(--fg);
    cursor: pointer;
  }
  .pager button:hover:not(:disabled) { border-color: var(--hit); }
  .pager button:disabled { opacity: 0.4; cursor: default; }
  #pager-label { min-width: 110px; text-align: center; font-variant-numeric: tabular-nums; }
  .search { position: relative; }
  /* Sits over the input with matching font and padding so the completion
     lines up right after the typed text. */
  .ghost {
    position: absolute;
    inset: 0;
    padding: 14px 18px;
    border: 2px solid transparent;
    font-size: 1.4rem;
    line-height: normal;
    white-space: pre;
    overflow: hidden;
    pointer-events: none;
    display: flex;
    align-items: center;
  }
  #ghost-typed { visibility: hidden; }
  #ghost-rest { color: var(--muted); opacity: 0.7; }
  .suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 10;
    margin: 4px 0 0;
    padding: 4px;
    list-style: none;
    background: var(--slot);
    border: 2px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
  }
  .suggestions li {
    display: flex;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 5px;
    cursor: pointer;
  }
  .suggestions li .dex { color: var(--muted); font-variant-numeric: tabular-nums; }
  .suggestions li.active { background: var(--hit); color: var(--hit-fg); }
  .suggestions li.active .dex { color: var(--hit-fg); }
  .mon { color: var(--muted); margin-bottom: 2px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="controls">
    <h1>Binder Finder</h1>
    <p class="tagline">Find where any card goes in a 4×4 binder</p>
    <div class="search">
      <input id="num" type="text" autocomplete="off" spellcheck="false" placeholder="Card # or Pokémon name, then Enter" autofocus>
      <div class="ghost" aria-hidden="true"><span id="ghost-typed"></span><span id="ghost-rest"></span></div>
      <ul class="suggestions hidden" id="suggestions"></ul>
    </div>
  </div>

  <div class="info invisible" id="info">
    <div class="mon" id="mon"></div>
    <div class="where">Page <strong id="page"></strong> · Sheet <strong id="side"></strong></div>
    <div class="sub" id="detail"></div>
  </div>
  <div class="spread" id="spread"></div>
  <div class="pager">
    <button id="prev" type="button">◀ Prev</button>
    <span id="pager-label"></span>
    <button id="next" type="button">Next ▶</button>
  </div>
</main>

    "Greavard", "Houndstone", "Flamigo", "Cetoddle", "Cetitan", "Veluza", "Dondozo", "Tatsugiri", "Annihilape", "Clodsire",
    "Farigiraf", "Dudunsparce", "Kingambit", "Great Tusk", "Scream Tail", "Brute Bonnet", "Flutter Mane", "Slither Wing", "Sandy Shocks", "Iron Treads",
    "Iron Bundle", "Iron Hands", "Iron Jugulis", "Iron Moth", "Iron Thorns", "Frigibax", "Arctibax", "Baxcalibur", "Gimmighoul", "Gholdengo",
    "Wo-Chien", "Chien-Pao", "Ting-Lu", "Chi-Yu", "Roaring Moon", "Iron Valiant", "Koraidon", "Miraidon", "Walking Wake", "Iron Leaves",
    "Dipplin", "Poltchageist", "Sinistcha", "Okidogi", "Munkidori", "Fezandipiti", "Ogerpon", "Archaludon", "Hydrapple", "Gouging Fire",
    "Raging Bolt", "Iron Boulder", "Iron Crown", "Terapagos", "Pecharunt",
  ];
  const MAX_SUGGESTIONS = 8;
  const list = document.getElementById('suggestions');
  const ghostTyped = document.getElementById('ghost-typed');
  const ghostRest = document.getElementById('ghost-rest');
  let matches = [];
  let active = -1;

  // Lowercase, drop accents and punctuation so "flabebe" or "mr mime" still match.
  function norm(s) {
    return s.toLowerCase()
      .replace(/♀/g, 'f').replace(/♂/g, 'm')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]/g, '');
  }
  const NORMALIZED = POKEMON.map(norm);

  function findMatches(q) {
    const nq = norm(q);
    if (!nq || /^\d+$/.test(q.trim())) return [];
    const starts = [];
    const contains = [];
    NORMALIZED.forEach((name, i) => {
      if (name.startsWith(nq)) starts.push(i + 1);
      else if (name.includes(nq)) contains.push(i + 1);
    });
    return starts.concat(contains).slice(0, MAX_SUGGESTIONS);
  }

  function renderSuggestions() {
    list.innerHTML = '';
    matches.forEach((dex, i) => {
      const li = document.createElement('li');
      if (i === active) li.className = 'active';
      li.innerHTML = `<span></span><span class="dex">#${String(dex).padStart(4, '0')}</span>`;
      li.firstChild.textContent = POKEMON[dex - 1];
      // mousedown fires before the input loses focus
      li.addEventListener('mousedown', (e) => {
        e.preventDefault();
        pick(dex);
      });
      list.appendChild(li);
    });
    list.classList.toggle('hidden', matches.length === 0);
    updateGhost();
  }

  // Inline typeahead: the rest of the highlighted name, shown faintly after
  // what's typed when the name starts with it. Tab accepts it.
  function updateGhost() {
    const name = active !== -1 ? POKEMON[matches[active] - 1] : '';
    const typed = input.value;
    const fits = typed && name.toLowerCase().startsWith(typed.toLowerCase()) && name.length > typed.length;
    ghostTyped.textContent = fits ? typed : '';
    ghostRest.textContent = fits ? name.slice(typed.length) : '';
  }

  function closeSuggestions() {
    matches = [];
    active = -1;
    renderSuggestions();
  }

  function pick(dex) {
    input.value = POKEMON[dex - 1];
    closeSuggestions();
    show(dex);
    input.select();
  }

  input.addEventListener('input', () => {
    matches = findMatches(input.value);
    active = matches.length ? 0 : -1;
    renderSuggestions();
  });

  input.addEventListener('blur', closeSuggestions);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!matches.length) return;
      e.preventDefault();
      const step = e.key === 'ArrowDown' ? 1 : -1;
      active = (active + step + matches.length) % matches.length;
      renderSuggestions();
      return;
    }
    if (e.key === 'Escape') {
      closeSuggestions();
      return;
    }
    // Tab completes the highlighted name and jumps the preview to it.
    if (e.key === 'Tab' && !e.shiftKey && active !== -1) {
      e.preventDefault();
      const dex = matches[active];
      input.value = POKEMON[dex - 1];
      show(dex);
      matches = findMatches(input.value);
      active = matches.length ? 0 : -1;
      renderSuggestions();
      return;
    }
    if (e.key !== 'Enter') return;

    const raw = input.value.trim();
    if (/^\d+$/.test(raw)) {
      const n = parseInt(raw, 10);
      if (n < 1) return;
      closeSuggestions();
      show(n);
      input.select();
      return;
    }
    const exact = NORMALIZED.indexOf(norm(raw));
    if (exact !== -1) pick(exact + 1);
    else if (active !== -1) pick(matches[active]);
  });

  document.getElementById('prev').addEventListener('click', () => renderSpread(spreadIndex - 1));
  document.getElementById('next').addEventListener('click', () => renderSpread(spreadIndex + 1));

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const inInput = document.activeElement === input;

    // Left/right flip pages, unless the user is moving the cursor while editing
    // (text present and not entirely selected, as it is right after a search).
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const editing = inInput && input.value !== '' &&
        !(input.selectionStart === 0 && input.selectionEnd === input.value.length);
      if (editing) return;
      e.preventDefault();
      renderSpread(spreadIndex + (e.key === 'ArrowRight' ? 1 : -1));
      return;
    }

    // Any printable key elsewhere on the page starts a new search. Focusing
    // during keydown sends the typed character into the input, replacing
    // the selected old text. Space is left alone so it can still press buttons.
    if (!inInput && e.key.length === 1 && e.key !== ' ') {
      input.focus();
      input.select();
    }
  });

  // Spread 0 is sheet 1 alone; spread k (k >= 1) is sheets 2k and 2k+1,
  // i.e. the back of page k and the front of page k+1.
  function spreadOf(sheet) {
    return Math.floor(sheet / 2);
  }

  function renderSpread(k) {
    spreadIndex = Math.max(0, k);
    const left = spreadIndex === 0 ? null : spreadIndex * 2;
    const right = spreadIndex === 0 ? 1 : left + 1;

    const spread = document.getElementById('spread');
    spread.innerHTML = '';
    spread.appendChild(renderSide(left, target, targetSheet));
    spread.appendChild(renderSide(right, target, targetSheet));

    document.getElementById('pager-label').textContent =
      spreadIndex === 0 ? 'Page 1' : `Pages ${spreadIndex}–${spreadIndex + 1}`;
    document.getElementById('prev').disabled = spreadIndex === 0;
  }

  function show(n) {
    const name = POKEMON[n - 1];
    document.getElementById('mon').textContent = name ? `${name} · Pokédex #${n}` : '';
    // A "sheet" is one 4x4 face; a "page" is a physical hard page with two sheets.
    const side = Math.ceil(n / PER_PAGE);
    const index = (n - 1) % PER_PAGE;
    const row = Math.floor(index / COLS) + 1;
    const col = (index % COLS) + 1;
    const page = Math.ceil(side / 2);
    const face = side % 2 === 1 ? 'front' : 'back';
    const lr = side === 1 ? '' : side % 2 === 0 ? ', left' : ', right';

    document.getElementById('page').textContent = page;
    document.getElementById('side').textContent = side;
    document.getElementById('detail').textContent =
      `Row ${row}, column ${col} · slot ${index + 1} of 16 · ${face} of page ${page}${lr}`;

    target = n;
    targetSheet = side;
    document.getElementById('info').classList.remove('invisible');
    renderSpread(spreadOf(side));
  }

  renderSpread(0);

  function renderSide(p, n, current) {
    const wrap = document.createElement('div');
    if (p === null) {
      wrap.className = 'page empty';
      return wrap;
    }
    wrap.className = 'page' + (p === current ? ' current' : '');

    const label = document.createElement('div');
    label.className = 'page-label';
    label.textContent = `Page ${Math.ceil(p / 2)} ${p % 2 === 1 ? 'front' : 'back'} · Sheet ${p}`;
    wrap.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'grid';
    const first = (p - 1) * PER_PAGE + 1;
    for (let i = 0; i < PER_PAGE; i++) {
      const num = first + i;
      const div = document.createElement('div');
      div.className = 'slot' + (num === n ? ' hit' : '');
      div.textContent = num;
      const name = POKEMON[num - 1];
      if (name) {
        const label = document.createElement('span');
        label.className = 'slot-name';
        label.textContent = name;
        div.title = `#${num} ${name}`;
        div.appendChild(label);
      }
      grid.appendChild(div);
    }
    wrap.appendChild(grid);
    return wrap;
  }
</script>
</body>
</html>
